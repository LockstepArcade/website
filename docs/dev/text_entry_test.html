<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>
// Test page for DOM text inputs overlaid on a canvas, reproducing how the web client hosts them
// (see docs/tasks/WEB_TEXT_ENTRY.md). Not linked from anywhere. Options come from the query string,
// and are read here, before the rest of the head, because the viewport meta's interactive-widget
// is only honoured if it is in place as the page is parsed.
var OPTS = (function()
{
    var defaults = {
        iw: '',          // viewport interactive-widget: '', resizes-visual, resizes-content, overlays-content
        size: 'visual',  // canvas buffer: visual (as the client), layout, visualbox (container follows visual viewport)
        us: '0',         // 1: user-select:text on the inputs, overriding the body's none
        freeze: '0',     // 1: keep the page's layout height while an input has focus
        hide: 'clip',    // clip (as the client): display:none when outside the clip rect; never
        fs: 'half',      // font size: half (as the client, half the field height); 16 (at least 16px)
        place: 'every',  // every (as the client): write position every frame; changed: only when it moves
        stopkeys: '1',   // 1 (as the client): stop key and mouse events propagating from the inputs
        scroll: '0',     // 1: page taller than the screen, scrolled by dragging the canvas
        vcenter: '1',    // 1: content centred vertically when it fits, so a height change moves it
        nameac: 'off'    // autocomplete for the name field: off, nickname, username
    };
    var params = new URLSearchParams(location.search);
    var result = {};
    for(var key in defaults)
        result[key] = params.has(key) ? params.get(key) : defaults[key];
    return result;
})();
document.write('<meta name="viewport" content="width=device-width, initial-scale=1'
    + (OPTS.iw ? ', interactive-widget=' + OPTS.iw : '') + '">');
</script>
<title>Text entry test</title>
<style>
    /* As the client's shell.html. */
    body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #000;
        overflow: hidden;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
    }
    #canvas-container {
        width: 100%;
        height: 100vh;
        height: 100dvh;
        position: fixed;
        top: 0;
        left: 0;
    }
    #canvas {
        display: block;
        width: 100%;
        height: 100%;
        border: 0 none;
        outline: none;
        touch-action: none;
    }

    /* The harness's own panels, not part of what is being tested. */
    .panel {
        position: fixed;
        left: 4px;
        right: 4px;
        top: 4px;
        max-height: 45%;
        overflow: auto;
        z-index: 20000;
        background: rgba(20, 20, 30, 0.95);
        color: #ddd;
        font: 12px monospace;
        padding: 6px;
        border: 1px solid #555;
        border-radius: 4px;
        display: none;
        -webkit-user-select: text;
        user-select: text;
    }
    .panel button, .panel select {
        font-size: 14px;
        margin: 2px;
    }
    #log-lines {
        white-space: pre-wrap;
        word-break: break-all;
    }
    @keyframes autofill-start { from {} to {} }
    input:-webkit-autofill { animation-name: autofill-start; animation-duration: 0.001s; }
</style>
</head>
<body>
<div id="canvas-container">
    <canvas id="canvas" tabindex="-1"></canvas>
</div>

<div id="log-panel" class="panel">
    <div>
        <button id="log-copy">Copy log</button>
        <button id="log-clear">Clear</button>
        <button id="log-close">Close</button>
        <button id="log-key">Key only: off</button>
        <button id="log-order">Newest first</button>
    </div>
    <div id="log-lines"></div>
</div>

<div id="settings-panel" class="panel">
    <div id="settings-fields"></div>
    <div>
        <button id="settings-apply">Apply (reloads)</button>
        <button id="settings-close">Close</button>
    </div>
</div>

<script>
(function()
{
    'use strict';

    var container = document.getElementById('canvas-container');
    var canvas = document.getElementById('canvas');
    var ctx = canvas.getContext('2d');

    // ---------------------------------------------------------------------------------------------
    // Log

    var log_entries = [];
    var start_time = performance.now();
    var log_lines = document.getElementById('log-lines');

    function Log(text)
    {
        var line = ((performance.now() - start_time) / 1000).toFixed(3) + ' ' + text;
        log_entries.push(line);
        if(log_entries.length > 2000)
            log_entries.shift();
        console.log(line);
        if(log_panel.style.display === 'block')
            RenderLog();
    }

    // What a failing tap is read from, for a short log that can be read on the phone itself.
    var KEY_PATTERNS = [' focus ', ' blur ', 'activeElement', 'hidden', ' shown', 'moved while focused',
        'visualViewport resize', 'canvas buffer', 'tap on ', ' pointerdown', ' touchstart', ' click',
        'page ', 'popstate', 'autofilled'];
    var log_key_only = false;
    var log_oldest_first = false;

    function IsKeyLine(line)
    {
        return KEY_PATTERNS.some(function(p) { return line.indexOf(p) >= 0; });
    }

    function RenderLog()
    {
        var lines = log_key_only ? log_entries.filter(IsKeyLine) : log_entries;
        lines = lines.slice(-300);
        if(!log_oldest_first)
            lines = lines.reverse();
        log_lines.textContent = lines.join('\n');
    }

    function Describe(el)
    {
        if(!el)
            return 'null';
        if(el === document.body)
            return 'body';
        return el.tagName.toLowerCase() + (el.id ? '#' + el.id : '');
    }

    function ViewportSummary()
    {
        var vp = window.visualViewport;
        var s = 'inner=' + window.innerWidth + 'x' + window.innerHeight;
        if(vp)
        {
            s += ' visual=' + Math.round(vp.width) + 'x' + Math.round(vp.height)
                + ' offset=' + Math.round(vp.offsetLeft) + ',' + Math.round(vp.offsetTop)
                + ' scale=' + vp.scale.toFixed(2);
        }
        return s;
    }

    var log_panel = document.getElementById('log-panel');
    var settings_panel = document.getElementById('settings-panel');

    document.getElementById('log-close').onclick = function() { log_panel.style.display = 'none'; };
    document.getElementById('log-clear').onclick = function() { log_entries = []; RenderLog(); };
    document.getElementById('log-key').onclick = function()
    {
        log_key_only = !log_key_only;
        this.textContent = 'Key only: ' + (log_key_only ? 'on' : 'off');
        RenderLog();
    };
    document.getElementById('log-order').onclick = function()
    {
        log_oldest_first = !log_oldest_first;
        this.textContent = log_oldest_first ? 'Oldest first' : 'Newest first';
        RenderLog();
    };
    document.getElementById('log-copy').onclick = function()
    {
        var text = 'Options: ' + location.search + '\nUser agent: ' + navigator.userAgent + '\n'
            + log_entries.join('\n');
        if(navigator.clipboard && navigator.clipboard.writeText)
        {
            navigator.clipboard.writeText(text).then(
                function() { Log('log copied to clipboard'); },
                function(e) { Log('clipboard write failed: ' + e); });
        }
        else
        {
            // No clipboard API outside a secure context, as on a LAN address over http.
            var area = document.createElement('textarea');
            area.value = text;
            area.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;';
            document.body.appendChild(area);
            area.select();
            var copied = document.execCommand('copy');
            document.body.removeChild(area);
            Log(copied ? 'log copied to clipboard' : 'copy failed: select the log text by hand');
        }
    };

    Log('start ' + location.search + ' ' + navigator.userAgent);
    Log('viewport ' + ViewportSummary());

    // ---------------------------------------------------------------------------------------------
    // Settings

    var SETTINGS = [
        ['iw', ['', 'resizes-visual', 'resizes-content', 'overlays-content']],
        ['size', ['visual', 'layout', 'visualbox']],
        ['us', ['0', '1']],
        ['freeze', ['0', '1']],
        ['hide', ['clip', 'never']],
        ['fs', ['half', '16']],
        ['place', ['every', 'changed']],
        ['stopkeys', ['1', '0']],
        ['scroll', ['0', '1']],
        ['vcenter', ['1', '0']],
        ['nameac', ['off', 'nickname', 'username']]
    ];

    (function BuildSettings()
    {
        var fields = document.getElementById('settings-fields');
        SETTINGS.forEach(function(setting)
        {
            var row = document.createElement('div');
            var label = document.createElement('span');
            label.textContent = setting[0] + ': ';
            var select = document.createElement('select');
            select.id = 'setting-' + setting[0];
            setting[1].forEach(function(value)
            {
                var option = document.createElement('option');
                option.value = value;
                option.textContent = value === '' ? '(default)' : value;
                if(OPTS[setting[0]] === value)
                    option.selected = true;
                select.appendChild(option);
            });
            row.appendChild(label);
            row.appendChild(select);
            fields.appendChild(row);
        });
    })();

    document.getElementById('settings-close').onclick = function() { settings_panel.style.display = 'none'; };
    document.getElementById('settings-apply').onclick = function()
    {
        var params = new URLSearchParams();
        SETTINGS.forEach(function(setting)
        {
            params.set(setting[0], document.getElementById('setting-' + setting[0]).value);
        });
        location.search = params.toString();
    };

    // ---------------------------------------------------------------------------------------------
    // Test inputs, built as the client builds them

    function StopEvents(el)
    {
        if(OPTS.stopkeys !== '1')
            return;
        ['keydown', 'keyup', 'keypress', 'mousedown', 'mouseup'].forEach(function(evt)
        {
            el.addEventListener(evt, function(e) { e.stopPropagation(); }, true);
        });
    }

    function StyleInput(input)
    {
        input.style.cssText = 'width:100%;height:100%;box-sizing:border-box;'
            + 'padding:0 8px;font-family:sans-serif;font-size:inherit;'
            + 'border:1px solid #555;border-radius:4px;background:#222;color:#eee;'
            + 'outline:none;';
        if(OPTS.us === '1')
        {
            input.style.webkitUserSelect = 'text';
            input.style.userSelect = 'text';
        }
    }

    function Instrument(input)
    {
        var name = Describe(input);
        ['focus', 'blur'].forEach(function(evt)
        {
            input.addEventListener(evt, function(e)
            {
                Log(name + ' ' + evt + ' related=' + Describe(e.relatedTarget) + ' ' + ViewportSummary());
            });
        });
        ['pointerdown', 'pointerup', 'pointercancel', 'touchstart', 'touchend', 'touchcancel',
            'mousedown', 'mouseup', 'click', 'contextmenu', 'select', 'change',
            'compositionstart', 'compositionend'].forEach(function(evt)
        {
            input.addEventListener(evt, function(e)
            {
                Log(name + ' ' + evt + (e.defaultPrevented ? ' (prevented)' : '')
                    + ' sel=' + input.selectionStart + '-' + input.selectionEnd);
            }, true);
        });
        input.addEventListener('keydown', function(e)
        {
            Log(name + ' keydown key=' + e.key + ' code=' + e.keyCode);
        }, true);
        input.addEventListener('beforeinput', function(e)
        {
            Log(name + ' beforeinput ' + e.inputType);
        });
        input.addEventListener('input', function(e)
        {
            Log(name + ' input ' + e.inputType + ' length=' + input.value.length
                + ' trusted=' + e.isTrusted + ' sel=' + input.selectionStart + '-' + input.selectionEnd);
        });
        input.addEventListener('animationstart', function(e)
        {
            if(e.animationName === 'autofill-start')
                Log(name + ' autofilled length=' + input.value.length);
        });
        var style = getComputedStyle(input);
        Log(name + ' computed user-select=' + (style.userSelect || style.webkitUserSelect));
    }

    function MakeContainerChild(el)
    {
        container.appendChild(el);
    }

    // The credentials form: the same ids, names and autocomplete as the client's, so that an entry
    // saved for the client on this origin is offered here.
    var form = document.createElement('form');
    form.id = 'credentials_form';
    form.method = 'post';
    form.action = '';
    form.style.cssText = 'position:fixed;z-index:10000;margin:0;padding:0;display:none;';
    var username = document.createElement('input');
    username.type = 'hidden';
    username.id = 'credentials_username';
    username.name = 'username';
    username.autocomplete = 'username';
    username.value = 'player';
    var password = document.createElement('input');
    password.type = 'password';
    password.id = 'credentials_string';
    password.name = 'password';
    password.autocomplete = 'current-password';
    StyleInput(password);
    form.appendChild(username);
    form.appendChild(password);
    form.addEventListener('submit', function(e)
    {
        e.preventDefault();
        Log('credentials form submit');
    });
    MakeContainerChild(form);
    StopEvents(password);
    Instrument(password);

    var name_input = document.createElement('input');
    name_input.type = 'text';
    name_input.id = 'new_account_name';
    name_input.name = 'name';
    name_input.autocomplete = OPTS.nameac;
    name_input.placeholder = 'Enter your name...';
    StyleInput(name_input);
    name_input.style.position = 'fixed';
    name_input.style.zIndex = '10000';
    name_input.style.display = 'none';
    MakeContainerChild(name_input);
    StopEvents(name_input);
    Instrument(name_input);

    // What placement moves: the form for the password field, the input itself for the name.
    var placed = [
        { el: form, input: password, last: null, shown: false, used: false },
        { el: name_input, input: name_input, last: null, shown: false, used: false }
    ];

    document.addEventListener('selectionchange', function()
    {
        var a = document.activeElement;
        if(a === password || a === name_input)
            Log(Describe(a) + ' selectionchange sel=' + a.selectionStart + '-' + a.selectionEnd);
    });

    // Where each tap lands, and where the password field is then, which tells a tap that missed the
    // field from focus lost afterwards.
    document.addEventListener('pointerdown', function(e)
    {
        if(log_panel.contains(e.target) || settings_panel.contains(e.target))
            return;
        var r = password.getBoundingClientRect();
        Log('tap on ' + Describe(e.target) + ' at ' + Math.round(e.clientX) + ',' + Math.round(e.clientY)
            + ' password field at ' + Math.round(r.left) + ',' + Math.round(r.top) + ' '
            + Math.round(r.width) + 'x' + Math.round(r.height) + ' ' + ViewportSummary());
    }, true);

    // As SDL's: key handlers on the window, which prevent the default of navigation keys.
    window.addEventListener('keydown', function(e)
    {
        var nav = ['Backspace', 'Tab', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'];
        if(nav.indexOf(e.key) >= 0)
        {
            e.preventDefault();
            Log('window keydown ' + e.key + ' reached the canvas handler, default prevented');
        }
    });

    if(window.visualViewport)
    {
        window.visualViewport.addEventListener('resize', function() { Log('visualViewport resize ' + ViewportSummary()); });
        window.visualViewport.addEventListener('scroll', function() { Log('visualViewport scroll ' + ViewportSummary()); });
    }
    window.addEventListener('resize', function() { Log('window resize ' + ViewportSummary()); });
    document.addEventListener('visibilitychange', function() { Log('visibility ' + document.visibilityState); });

    // ---------------------------------------------------------------------------------------------
    // Pages, as an immediate mode UI drawn to the canvas

    var page = 'menu';
    var page_scroll = 0;

    function GoTo(next)
    {
        Log('page ' + page + ' -> ' + next);
        history.pushState({ page: next }, '');
        page = next;
        page_scroll = 0;
    }

    history.replaceState({ page: 'menu' }, '');
    window.addEventListener('popstate', function(e)
    {
        var next = (e.state && e.state.page) || 'menu';
        Log('popstate (back) page ' + page + ' -> ' + next);
        page = next;
        page_scroll = 0;
    });

    var display_w = 1;
    var display_h = 1;
    var frozen_h = null;
    var buttons = [];
    var pointer = null;

    function FocusedTestInput()
    {
        var a = document.activeElement;
        return a === password || a === name_input;
    }

    function Resize()
    {
        var vp = window.visualViewport;
        var w, h;
        if(OPTS.size === 'layout' || !vp)
        {
            w = window.innerWidth;
            h = window.innerHeight;
        }
        else
        {
            w = Math.round(vp.width);
            h = Math.round(vp.height);
        }
        if(OPTS.size === 'visualbox' && vp)
        {
            container.style.top = vp.offsetTop + 'px';
            container.style.left = vp.offsetLeft + 'px';
            container.style.width = vp.width + 'px';
            container.style.height = vp.height + 'px';
        }

        if(OPTS.freeze === '1')
        {
            if(FocusedTestInput())
            {
                if(frozen_h === null)
                    frozen_h = display_h;
                h = frozen_h;
            }
            else
            {
                frozen_h = null;
            }
        }

        var dpr = window.devicePixelRatio || 1;
        var bw = Math.round(w * dpr);
        var bh = Math.round(h * dpr);
        if(canvas.width !== bw || canvas.height !== bh)
        {
            canvas.width = bw;
            canvas.height = bh;
            Log('canvas buffer ' + w + 'x' + h + ' css=' + Math.round(canvas.getBoundingClientRect().width)
                + 'x' + Math.round(canvas.getBoundingClientRect().height));
        }
        display_w = w;
        display_h = h;
    }

    var ROW = 44;
    var GAP = 12;

    // Content is laid out as a column of rows, then offset to centre it or by the drag scroll.
    function LayoutRows(rows)
    {
        var total = 0;
        rows.forEach(function(r) { total += r.h + GAP; });
        var top = 60;
        var available = display_h - top;
        var y;
        if(total <= available && OPTS.vcenter === '1')
        {
            y = top + (available - total) / 2;
            page_scroll = 0;
        }
        else
        {
            var min_scroll = Math.min(0, available - total - GAP);
            page_scroll = Math.max(min_scroll, Math.min(0, page_scroll));
            y = top + page_scroll;
        }
        rows.forEach(function(r)
        {
            r.y = y;
            y += r.h + GAP;
        });
    }

    function DrawButton(label, x, y, w, h, onclick)
    {
        ctx.fillStyle = '#2d5a8a';
        ctx.fillRect(x, y, w, h);
        ctx.fillStyle = '#fff';
        ctx.font = '16px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(label, x + w / 2, y + h / 2);
        buttons.push({ x: x, y: y, w: w, h: h, onclick: onclick, label: label });
    }

    function DrawText(text, x, y, colour)
    {
        ctx.fillStyle = colour || '#ccc';
        ctx.font = '15px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(text, x, y);
    }

    // As PlaceCentredWebDomElement: the element goes over the rect reserved for it, converted to
    // CSS pixels through the canvas's bounding rect, and is hidden when outside the clip rect.
    function Place(p, x, y, w, h, clip_top, clip_bottom)
    {
        p.used = true;
        var inside = y >= clip_top && y + h <= clip_bottom;
        if(!inside && OPTS.hide === 'clip')
        {
            if(p.shown)
            {
                Log(Describe(p.el) + ' hidden by clip' + (document.activeElement === p.input ? ' WHILE FOCUSED' : ''));
                p.shown = false;
            }
            p.el.style.display = 'none';
            return;
        }

        var rect = canvas.getBoundingClientRect();
        var sx = rect.width / display_w;
        var sy = rect.height / display_h;
        var css = {
            left: rect.left + x * sx,
            top: rect.top + y * sy,
            width: w * sx,
            height: h * sy
        };
        var font = Math.round(css.height * 0.5);
        if(OPTS.fs === '16')
            font = Math.max(16, font);

        var moved = !p.last
            || Math.abs(p.last.left - css.left) > 1 || Math.abs(p.last.top - css.top) > 1
            || Math.abs(p.last.width - css.width) > 1 || Math.abs(p.last.height - css.height) > 1;
        if(moved && p.last && document.activeElement === p.input)
        {
            Log(Describe(p.el) + ' moved while focused to ' + Math.round(css.left) + ',' + Math.round(css.top)
                + ' ' + Math.round(css.width) + 'x' + Math.round(css.height));
        }
        if(!p.shown)
        {
            Log(Describe(p.el) + ' shown');
            p.shown = true;
        }

        if(OPTS.place === 'every' || moved || p.el.style.display === 'none')
        {
            p.el.style.display = 'block';
            p.el.style.left = css.left + 'px';
            p.el.style.top = css.top + 'px';
            p.el.style.width = css.width + 'px';
            p.el.style.height = css.height + 'px';
            p.el.style.fontSize = font + 'px';
        }
        p.last = css;
    }

    function HideUnused()
    {
        placed.forEach(function(p)
        {
            if(!p.used && p.el.style.display !== 'none')
            {
                Log(Describe(p.el) + ' hidden, page not showing it' + (document.activeElement === p.input ? ' WHILE FOCUSED' : ''));
                p.el.style.display = 'none';
                p.shown = false;
                p.last = null;
            }
            p.used = false;
        });
    }

    function Filler(rows, n)
    {
        for(var i = 0; i < n; ++i)
            rows.push({ h: ROW, draw: (function(i) { return function(r) { DrawText('Filler line ' + (i + 1), display_w / 2, r.y + ROW / 2, '#666'); }; })(i) });
    }

    function BuildPage()
    {
        var cw = Math.min(display_w - 32, 360);
        var cx = (display_w - cw) / 2;
        var rows = [];
        var filler = OPTS.scroll === '1' ? 8 : 0;

        if(page === 'menu')
        {
            rows.push({ h: ROW, draw: function(r) { DrawText('Text entry test', display_w / 2, r.y + ROW / 2, '#fff'); } });
            rows.push({ h: ROW, draw: function(r) { DrawButton('Credentials page', cx, r.y, cw, ROW, function() { GoTo('credentials'); }); } });
            rows.push({ h: ROW, draw: function(r) { DrawButton('Name page', cx, r.y, cw, ROW, function() { GoTo('name'); }); } });
            rows.push({ h: ROW, draw: function(r) { DrawButton('Both on one page', cx, r.y, cw, ROW, function() { GoTo('both'); }); } });
        }
        else
        {
            var with_password = page === 'credentials' || page === 'both';
            var with_name = page === 'name' || page === 'both';
            rows.push({ h: ROW, draw: function(r) { DrawText(page, display_w / 2, r.y + ROW / 2, '#fff'); } });
            Filler(rows, filler);
            if(with_name)
            {
                rows.push({ h: ROW, draw: function(r) { DrawText('Name', display_w / 2, r.y + ROW / 2); } });
                rows.push({ h: ROW, draw: function(r, clip) { Place(placed[1], cx, r.y, cw, ROW, clip.top, clip.bottom); } });
                rows.push({ h: ROW, draw: function(r) { DrawButton('Connect with new account', cx, r.y, cw, ROW, function() { Log('name accepted, length ' + name_input.value.length); }); } });
            }
            if(with_password)
            {
                rows.push({ h: ROW, draw: function(r) { DrawText('Credentials string', display_w / 2, r.y + ROW / 2); } });
                rows.push({ h: ROW, draw: function(r, clip) { Place(placed[0], cx, r.y, cw, ROW, clip.top, clip.bottom); } });
                rows.push({ h: ROW, draw: function(r) { DrawButton('Set credentials', cx, r.y, cw, ROW, function() { form.requestSubmit(); }); } });
            }
            Filler(rows, filler);
            rows.push({ h: ROW, draw: function(r) { DrawButton('Back', cx, r.y, cw, ROW, function() { history.back(); }); } });
        }
        return rows;
    }

    function Frame()
    {
        Resize();
        buttons = [];

        ctx.setTransform(canvas.width / display_w, 0, 0, canvas.height / display_h, 0, 0);
        ctx.fillStyle = '#101018';
        ctx.fillRect(0, 0, display_w, display_h);

        // Harness controls along the top, outside the page's clip rect.
        var bw = (display_w - 24) / 3;
        DrawButton('Log', 6, 6, bw, 40, function() { log_panel.style.display = 'block'; RenderLog(); });
        DrawButton('Settings', 12 + bw, 6, bw, 40, function() { settings_panel.style.display = 'block'; });
        DrawButton('Blur', 18 + 2 * bw, 6, bw, 40, function() { if(document.activeElement) document.activeElement.blur(); });

        var rows = BuildPage();
        LayoutRows(rows);
        var clip = { top: 52, bottom: display_h };
        ctx.save();
        ctx.beginPath();
        ctx.rect(0, clip.top, display_w, clip.bottom - clip.top);
        ctx.clip();
        rows.forEach(function(r)
        {
            if(r.y + r.h >= clip.top - ROW && r.y <= clip.bottom + ROW)
                r.draw(r, clip);
            else if(r.draw.length >= 2)
                r.draw(r, clip); // fields are still placed, to be hidden by the clip test
        });
        ctx.restore();
        HideUnused();

        // Status line at the bottom.
        var a = document.activeElement;
        var status = 'active=' + Describe(a);
        if(a === password || a === name_input)
            status += ' len=' + a.value.length + ' sel=' + a.selectionStart + '-' + a.selectionEnd;
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(0, display_h - 22, display_w, 22);
        ctx.fillStyle = '#9c9';
        ctx.font = '11px monospace';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText(status + ' ' + display_w + 'x' + display_h, 4, display_h - 11);

        requestAnimationFrame(Frame);
    }

    var last_active = null;
    setInterval(function()
    {
        if(document.activeElement !== last_active)
        {
            last_active = document.activeElement;
            Log('activeElement ' + Describe(last_active));
        }
    }, 50);

    // As SDL: pointer handlers on the canvas only, with no default prevented.
    function ToDisplay(e)
    {
        var rect = canvas.getBoundingClientRect();
        return {
            x: (e.clientX - rect.left) * display_w / rect.width,
            y: (e.clientY - rect.top) * display_h / rect.height
        };
    }

    function ButtonAt(pos)
    {
        for(var i = buttons.length - 1; i >= 0; --i)
        {
            var b = buttons[i];
            if(pos.x >= b.x && pos.x < b.x + b.w && pos.y >= b.y && pos.y < b.y + b.h)
                return b;
        }
        return null;
    }

    canvas.addEventListener('pointerdown', function(e)
    {
        var pos = ToDisplay(e);
        pointer = { start: pos, last: pos, dragging: false, button: ButtonAt(pos) };
    });
    canvas.addEventListener('pointermove', function(e)
    {
        if(!pointer)
            return;
        var pos = ToDisplay(e);
        if(!pointer.dragging && Math.abs(pos.y - pointer.start.y) > 8)
            pointer.dragging = true;
        if(pointer.dragging)
            page_scroll += pos.y - pointer.last.y;
        pointer.last = pos;
    });
    canvas.addEventListener('pointerup', function(e)
    {
        if(!pointer)
            return;
        var pos = ToDisplay(e);
        var b = ButtonAt(pos);
        if(!pointer.dragging && b && pointer.button && b.label === pointer.button.label)
        {
            Log('button ' + b.label);
            b.onclick();
        }
        pointer = null;
    });
    canvas.addEventListener('pointercancel', function() { pointer = null; });

    requestAnimationFrame(Frame);
})();
</script>
</body>
</html>
